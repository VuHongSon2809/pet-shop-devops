# PAWSPA – Hệ thống Quản lý Cửa hàng Thú cưng (Đề 28)
# Chạy: docker compose up -d --build   (cần tạo .env trước bằng: python3 scripts/setup.py)
name: petshop

# ============================================================================
# Khối cấu hình dùng chung
# ============================================================================

# Log của mọi container: driver json-file, xoay vòng 10MB x 3 file,
# kèm nhãn tên service để Promtail gắn nhãn job (job="nginx", job="web"...)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.service,com.docker.compose.project"

# Hardening chung: bỏ toàn bộ Linux capabilities, cấm leo thang đặc quyền (setuid/sudo)
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging: *default-logging

# Biến môi trường dùng chung cho web và migrate (chỉ truyền đúng biến cần thiết)
x-app-env: &app-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DB_HOST: db
  DB_NAME: ${POSTGRES_DB}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,${SERVER_IP}
  DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost,https://127.0.0.1,https://${SERVER_IP}

x-app: &app
  <<: *hardened
  build: ./app
  image: petshop-web:local
  read_only: true                 # filesystem gốc chỉ đọc, chỉ /tmp được ghi (RAM)
  tmpfs: ["/tmp:size=32m,noexec,nosuid"]

# ============================================================================
# Mạng: tách theo vai trò. "internal: true" = không đi ra Internet,
# không publish cổng ra host được -> container chỉ nói chuyện với nhau.
# ============================================================================
networks:
  frontend:          # Internet/LAN <-> Nginx (cổng 80/443)
  admin:             # cổng quản trị chỉ mở 127.0.0.1: pgAdmin, Grafana, Prometheus
  app:
    internal: true   # Nginx <-> Django
  data:
    internal: true   # Django/pgAdmin/exporter <-> PostgreSQL
  monitoring:
    internal: true   # Prometheus, Grafana, Loki, Promtail, exporters

services:
  # ---------- Database ----------
  db:
    <<: *hardened
    image: postgres:16-alpine
    user: postgres                 # chạy bằng user postgres (uid 70), không phải root
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]               # KHÔNG publish cổng 5432 ra ngoài
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Tạo bảng + phân quyền DB + tài khoản admin + dữ liệu mẫu rồi tự thoát (Exited 0 là bình thường)
  migrate:
    <<: *app
    environment:
      <<: *app-env
      DB_USER: ${POSTGRES_USER}           # chủ sở hữu DB: chỉ dùng cho migrate
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MONITOR_DB_USER: ${MONITOR_DB_USER}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_db_roles &&
             python manage.py ensure_admin &&
             python manage.py seed_demo"
    restart: "no"
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  # ---------- Ứng dụng web ----------
  web:
    <<: *app
    environment:
      <<: *app-env
      DB_USER: ${APP_DB_USER}             # tài khoản hạn chế: chỉ SELECT/INSERT/UPDATE/DELETE
      DB_PASSWORD: ${APP_DB_PASSWORD}
    restart: unless-stopped
    networks: [app, data, monitoring]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- Reverse proxy ----------
  nginx:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.28-alpine   # chạy bằng user nginx (uid 101)
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [frontend, app, monitoring]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/stub_status"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- Công cụ quản lý DB ----------
  pgadmin:
    image: dpage/pgadmin4:9.17.0       # image chạy bằng user pgadmin (uid 5050)
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "127.0.0.1:5050:5050"   # chỉ mở trên máy chủ, truy cập từ xa qua SSH tunnel
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks: [admin, data]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy

  # ---------- Giám sát: Prometheus + Grafana + exporters ----------
  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.13.4     # chạy bằng user nobody
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks: [admin, monitoring]
    mem_limit: 512m
    cpus: 1.0

  grafana:
    <<: *hardened
    image: grafana/grafana:12.4.12     # chạy bằng user grafana (uid 472)
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/petshop-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [admin, monitoring]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Metrics CPU/RAM/mạng của các container.
  # NGOẠI LỆ hardening: cAdvisor cần privileged + mount /sys, /var/lib/docker để đọc cgroup của host.
  # Bù lại: chỉ mount chỉ đọc, chỉ nằm trong mạng internal "monitoring", không publish cổng.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    logging: *default-logging
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    mem_limit: 256m
    cpus: 0.5

  # Đọc trang stub_status nội bộ của Nginx và chuyển thành metrics
  nginx-exporter:
    <<: *hardened
    image: nginx/nginx-prometheus-exporter:1.5.3
    user: "65534:65534"
    read_only: true
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    networks: [monitoring]
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      - nginx

  # Metrics của PostgreSQL – dùng tài khoản petshop_monitor (chỉ có vai trò pg_monitor)
  postgres-exporter:
    <<: *hardened
    image: prometheuscommunity/postgres-exporter:v0.20.1
    user: "65534:65534"
    read_only: true
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${MONITOR_DB_USER}
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD}
    networks: [data, monitoring]
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---------- Log tập trung: Loki + Promtail ----------
  loki:
    <<: *hardened
    image: grafana/loki:3.6.11         # chạy bằng user loki (uid 10001)
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    networks: [monitoring]             # không publish cổng 3100
    mem_limit: 512m
    cpus: 1.0

  # NGOẠI LỆ non-root: file log Docker thuộc root (quyền 640) nên Promtail chạy uid 0,
  # nhưng đã bỏ mọi capability, filesystem chỉ đọc và chỉ mount thư mục log ở chế độ chỉ đọc.
  promtail:
    <<: *hardened
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail:/var/lib/promtail
    networks: [monitoring]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      - loki

volumes:
  pgdata:
  pgadmin:
  prometheus:
  grafana:
  loki:
  promtail:
