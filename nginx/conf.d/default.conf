# Nginx reverse proxy cho PAWSPA
# - HTTP (8080 trong container, cổng 80 ngoài host) tự chuyển sang HTTPS
# - HTTPS (8443 trong container, cổng 443 ngoài host) dùng chứng chỉ tự ký
# Image nginx-unprivileged chạy bằng user nginx (uid 101) nên chỉ nghe cổng > 1024.

server_tokens off;

# Log dạng JSON để Loki/LogQL tách trường dễ dàng (| json)
log_format json_combined escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"path":"$uri","query":"$args","status":$status,"bytes":$body_bytes_sent,'
  '"duration":$request_time,"upstream_time":"$upstream_response_time",'
  '"host":"$host","scheme":"$scheme","user_agent":"$http_user_agent","referer":"$http_referer"}';

# Chống dò mật khẩu: tối đa 10 request/phút/IP vào trang đăng nhập
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream django {
    server web:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log json_combined;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log json_combined;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 2m;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;

    location = /dang-nhap/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://django;
    }

    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://django;
    }

    location /static/ {
        proxy_pass http://django;
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public" always;
    }

    location / {
        proxy_pass http://django;
    }
}
