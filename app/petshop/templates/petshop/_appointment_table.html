<table class="table">
  <thead><tr><th>Giờ</th><th>Thú cưng</th><th>Dịch vụ</th><th>Trạng thái</th><th></th></tr></thead>
  <tbody>
  {% for a in items %}
    <tr>
      <td>{{ a.start_at|date:"d/m H:i" }}</td>
      <td>{{ a.pet.name }} <span class="muted">· {{ a.pet.owner.full_name }}</span></td>
      <td>{{ a.service.name }}</td>
      <td><span class="badge {{ a.status }}">{{ a.get_status_display }}</span></td>
      <td class="actions">{% include "petshop/_status_buttons.html" with a=a %}</td>
    </tr>
  {% empty %}
    <tr><td colspan="5" class="muted">{{ empty }}</td></tr>
  {% endfor %}
  </tbody>
</table>
