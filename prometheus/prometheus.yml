# Prometheus: cứ 15 giây lấy metrics (scrape) từ các endpoint dưới đây
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus          # chính Prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: containers          # CPU/RAM/mạng của từng container (cAdvisor)
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: django              # request, độ trễ, metrics nghiệp vụ của web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]

  - job_name: nginx               # kết nối, request của Nginx (nginx-exporter)
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: postgres            # trạng thái, kết nối, giao dịch của PostgreSQL
    static_configs:
      - targets: ["postgres-exporter:9187"]
